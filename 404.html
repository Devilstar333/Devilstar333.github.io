<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23020617'/%3E%3Crect x='5' y='5' width='14' height='14' rx='3' fill='none' stroke='%2310b981' stroke-width='1.6'/%3E%3Crect x='9.5' y='9.5' width='5' height='5' rx='1' fill='%2310b981'/%3E%3C/svg%3E" />
<link rel="canonical" href="https://devilstar333.github.io/" />
<!-- Fallback para rastreadores que não executam JavaScript (o JS abaixo é imediato e preserva a query string). -->
<meta http-equiv="refresh" content="3; url=https://devilstar333.github.io/" />
<title>Page moved — Local LLM Hardware Calculator</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  .card { max-width: 540px; text-align: center; background: rgba(255,255,255,.04);
          border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 28px; }
  h1 { font-size: 1.15rem; margin: 0 0 10px; }
  p { color: #94a3b8; font-size: .9rem; line-height: 1.6; margin: 0 0 10px; }
  a { display: inline-block; margin-top: 8px; background: #10b981; color: #020617; font-weight: 700;
      text-decoration: none; padding: 10px 18px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>This page moved</h1>
    <p>The calculator now lives at the root address. Redirecting you…</p>
    <p lang="pt-BR">A calculadora agora fica no endereço raiz. Redirecionando…</p>
    <a id="go" href="/">Go to the calculator &rarr;</a>
  </div>
<script>
  /* Redireciona apenas a URL antiga do projeto, preservando ?ram=&vram=&lang= etc.
     Para qualquer outro caminho inexistente, só oferece o link (sem redirect cego). */
  (function () {
    var path = window.location.pathname.replace(/\/+$/, '');
    var target = '/' + (window.location.search || '') + (window.location.hash || '');
    var link = document.getElementById('go');
    link.href = target;
    if (path.indexOf('/llm-hardware-calculator') === 0) {
      window.location.replace(target);
    }
  })();
</script>
</body>
</html>
